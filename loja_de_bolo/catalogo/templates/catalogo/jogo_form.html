{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }} - Girina Games</title>
    <link rel="stylesheet" href="{% static 'catalogo/style.css' %}">
</head>
<body>
<div class="vitrine">
    <h1>{{ titulo }}</h1>
    <form method="post" enctype='multipart/form-data'>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class='btn btn-confirmar'>Salvar</button>
    </form>
    <p><a href="{% url 'dashboard' %}" class="btn btn-voltar">Voltar ao painel</a></p>
</div>
</body>
</html>
